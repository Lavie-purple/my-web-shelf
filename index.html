<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="一个把在线网页收进书架的个人网址汇聚站">
<meta name="color-scheme" content="light dark">
<title>我的在线书架</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/skins.css">
</head>
<body data-theme="light" data-skin="gallery">
<script>
  /* 首屏防闪：?skin= 网址参数 / 本机偏好优先于 HTML 上的站点默认皮肤。
     data.json 里的默认皮肤由 tools/sync-seed.py 写入 body[data-skin]。 */
  (function () {
    var ok = ['wood', 'gallery', 'glass', 'editorial', 'terminal'];
    var q = new URLSearchParams(location.search).get('skin');
    var s = ok.indexOf(q) >= 0 ? q : null;
    if (!s) {
      try { s = (JSON.parse(localStorage.getItem('onlineshelf:prefs:v1') || '{}') || {}).skin; } catch (e) { s = null; }
    }
    if (ok.indexOf(s) >= 0) document.body.dataset.skin = s;
  })();
</script>

<header class="topbar">
  <div class="wrap topbar__in">
    <div class="brand">
      <span class="brand__mark"><svg class="ic"><use href="#i-book"/></svg></span>
      <div class="brand__text">
        <p class="brand__eyebrow">ONLINE SHELF <span class="brand__dot"></span> 网址汇聚站</p>
        <h1 id="siteTitle">我的在线书架</h1>
        <p class="brand__sub" id="siteSubtitle">把做过的、用过的、收藏过的网页，一本本摆上架子</p>
      </div>
    </div>

    <div class="topbar__actions">
      <label class="search" for="searchInput">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索名称、网址、标签" aria-label="搜索书架">
        <button type="button" id="searchClear" class="search__clear" aria-label="清除搜索" hidden><svg class="ic"><use href="#i-close"/></svg></button>
      </label>
      <button type="button" class="btn btn--icon" id="btnTheme" title="切换明暗外观" aria-label="切换明暗外观"><svg class="ic"><use href="#i-sun"/></svg></button>
      <button type="button" class="btn btn--primary" id="btnEdit"><svg class="ic"><use href="#i-sliders"/></svg><span>管理书架</span></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="notice" class="notice" hidden></div>

  <main>
    <div class="meta">
      <div class="meta__stats" id="stats"></div>
      <div class="meta__right">
        <span class="wide-badge" id="wideBadge">宽屏排布</span>
        <label class="density" for="skinSel" title="外观风格：只影响当前浏览器，不写入 data.json">
          <svg class="ic"><use href="#i-palette"/></svg><span class="density__label">风格</span>
          <select id="skinSel" aria-label="外观风格">
            <option value="auto">跟随站点</option>
            <option value="wood">实木书架</option>
            <option value="gallery">极简画廊</option>
            <option value="glass">暗夜玻璃</option>
            <option value="editorial">杂志纸刊</option>
            <option value="terminal">复古终端</option>
          </select>
        </label>
        <label class="density" for="densitySel" title="显示密度：只影响当前浏览器，不写入 data.json">
          <svg class="ic"><use href="#i-grid"/></svg><span class="density__label">密度</span>
          <select id="densitySel" aria-label="显示密度">
            <option value="auto">自动</option>
            <option value="compact">紧凑</option>
            <option value="large">大图</option>
            <option value="xl">超大</option>
          </select>
        </label>
        <span class="draft-badge" id="draftBadge" hidden><span class="draft-badge__dot"></span>本机草稿尚未发布</span>
        <span class="meta__hint" id="metaHint">点击封面即可打开网页</span>
      </div>
    </div>

    <div class="editbar" id="editbar" hidden>
      <div class="editbar__left">
        <span class="editbar__label"><svg class="ic"><use href="#i-pencil"/></svg>编辑模式</span>
        <button type="button" class="btn btn--sm" data-act="add-item"><svg class="ic"><use href="#i-plus"/></svg>添加网页</button>
        <button type="button" class="btn btn--sm" data-act="add-group"><svg class="ic"><use href="#i-folder"/></svg>新建分组</button>
        <button type="button" class="btn btn--sm" data-act="expand-all"><svg class="ic"><use href="#i-eye"/></svg>全部展开</button>
      </div>
      <div class="editbar__right">
        <button type="button" class="btn btn--sm" data-act="refresh-shots" title="重新抓取全部预览图"><svg class="ic"><use href="#i-refresh"/></svg>刷新预览</button>
        <button type="button" class="btn btn--sm" data-act="settings" title="标题、截图服务与更新频率"><svg class="ic"><use href="#i-info"/></svg>站点设置</button>
        <button type="button" class="btn btn--sm" data-act="import"><svg class="ic"><use href="#i-upload"/></svg>导入</button>
        <button type="button" class="btn btn--sm" data-act="export"><svg class="ic"><use href="#i-download"/></svg>导出 data.json</button>
        <button type="button" class="btn btn--sm btn--accent" data-act="github"><svg class="ic"><use href="#i-cloud"/></svg>发布到 GitHub</button>
        <button type="button" class="btn btn--sm" data-act="exit-edit"><svg class="ic"><use href="#i-close"/></svg>退出编辑</button>
      </div>
    </div>

    <div class="cabinet" id="shelves" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <p>预览图由截图服务实时生成，点击卡片跳转到目标网页 · 本站为纯静态页面，无后端、无追踪</p>
    <p id="footerStat"></p>
  </footer>
</div>

<dialog id="modal" class="modal" aria-labelledby="modalTitle">
  <form id="modalForm" novalidate>
    <div class="modal__head">
      <h2 id="modalTitle">标题</h2>
      <button type="button" class="btn btn--icon" data-act="close-modal" aria-label="关闭"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal__body" id="modalBody"></div>
    <div class="modal__foot" id="modalFoot"></div>
  </form>
</dialog>

<input type="file" id="fileInput" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
